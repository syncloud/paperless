PAPERLESS_REDIS=unix://{{ .DataDir }}/redis.sock
PAPERLESS_DBENGINE=postgresql
PAPERLESS_DBHOST={{ .DataDir }}/database
PAPERLESS_CONSUMPTION_DIR=/data/paperless/consume
PAPERLESS_DATA_DIR=/data/paperless/data
PAPERLESS_EMPTY_TRASH_DIR=/data/paperless/trash
PAPERLESS_MEDIA_ROOT=/data/paperless/media
PAPERLESS_STATICDIR={{ .AppDir }}/paperless/usr/src/paperless/static
PAPERLESS_SECRET_KEY={{ .Secret }}
PAPERLESS_URL={{ .Url }}
PAPERLESS_CONSUMER_POLLING_INTERVAL=10
PAPERLESS_THUMBNAIL_FONT_NAME={{ .AppDir }}/paperless/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
PAPERLESS_APPS="allauth.socialaccount.providers.openid_connect"
PAPERLESS_SOCIALACCOUNT_PROVIDERS='{{ .OIDCConfig }}'
PAPERLESS_DISABLE_REGULAR_LOGIN=true
PAPERLESS_REDIRECT_LOGIN_TO_SSO=true
PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP=syncloud
